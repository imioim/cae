<title>경쟁력 진단 엔진</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 상단 평가 정보 → 왼쪽 자료 입력(축별) / 오른쪽 결과(고정). 휴대폰에서는 결과가 위로 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e9edf1; --line:#d3dae1;
  --fg:#16212c; --muted:#5a6876; --accent:#1f5f8f; --accent-soft:#dbe8f2;
  --s1:#b23a33; --s2:#cf7a2b; --s3:#b39b2a; --s4:#4f8a5b; --s5:#1f7a6d; --na:#8a96a2;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --line:#2b3a47;
  --fg:#e3e9ef; --muted:#93a2b0; --accent:#7cb4dc; --accent-soft:#1d3447;
  --s1:#e0726a; --s2:#e5a061; --s3:#d6c262; --s4:#7fbd8a; --s5:#5ec2b1; --na:#6c7a87; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#16202a; --sunk:#1c2833; --line:#2b3a47;
  --fg:#e3e9ef; --muted:#93a2b0; --accent:#7cb4dc; --accent-soft:#1d3447;
  --s1:#e0726a; --s2:#e5a061; --s3:#d6c262; --s4:#7fbd8a; --s5:#5ec2b1; --na:#6c7a87; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:1.12rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:2.4em}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.meta label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.results{order:-1;position:static!important;max-height:none!important}}
.inputs{display:flex;flex-direction:column;gap:16px}
.axis-block{display:flex;flex-direction:column;gap:10px}
.axis-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.axis-tag{font-family:var(--f-mono);font-weight:500;background:var(--fg);color:var(--bg);border-radius:4px;padding:0 6px;font-size:.8rem}
.ind{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ind-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ind-q{font-size:.82rem;color:var(--muted)}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.field-label{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;font-weight:500}
.field-label .unit{font-weight:400;color:var(--muted);font-size:.78rem}
.hint{font-size:.76rem;color:var(--muted)}
details.ev summary{font-size:.78rem;color:var(--accent);cursor:pointer;list-style:none}
details.ev summary::before{content:"+ ";font-family:var(--f-mono)}
details.ev[open] summary::before{content:"− "}
.ev-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:6px;margin-top:6px}
.ev-grid textarea{grid-column:1 / -1}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:1.6rem;border-radius:5px;font-family:var(--f-mono);font-weight:500;font-size:.85rem;color:#fff;padding:0 6px;white-space:nowrap}
.c1{background:var(--s1)}.c2{background:var(--s2)}.c3{background:var(--s3)}.c4{background:var(--s4)}.c5{background:var(--s5)}.cna{background:var(--na)}
.results{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.summary{display:flex;flex-wrap:wrap;gap:16px;font-size:.82rem}
.summary b{font-family:var(--f-mono);font-size:1.05rem}
.profile svg{width:100%;height:auto;display:block}
.profile text{fill:var(--fg);font-family:var(--f-body)}
.profile .lbl{font-size:12px}
.profile .ax{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.06em}
.profile .tick{font-size:10px;fill:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.74rem;letter-spacing:.04em}
td select{padding:3px 4px;font-size:.78rem;width:auto}
td input{padding:3px 6px;font-size:.78rem}
.explain{color:var(--muted);font-size:.75rem}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;gap:10px;align-items:flex-start;border-left:3px solid var(--s1);padding:6px 10px;background:var(--sunk);border-radius:0 6px 6px 0;font-size:.82rem}
.ext{font-size:.8rem;display:flex;flex-direction:column;gap:6px}
.ctx{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap}
.notice{background:var(--accent-soft);border-radius:6px;padding:8px 10px;font-size:.8rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);max-width:min(560px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.list button{text-align:left;display:flex;justify-content:space-between;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="rubricMeta">평가 틀</div>
      <h1 id="rubricName">경쟁력 진단 엔진</h1>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
      <div class="toolbar">
        <button id="btnSave" class="primary" type="button">평가 저장</button>
        <button id="btnOpen" type="button">저장된 평가</button>
        <button id="btnNew" type="button">새 평가</button>
        <button id="btnExport" type="button">JSON 내보내기</button>
        <label class="hint" style="display:inline-flex;align-items:center;gap:6px"><button id="btnImport" type="button">불러오기</button></label>
        <input id="fileImport" type="file" accept=".json,application/json" hidden>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
  </header>

  <section class="meta" aria-label="평가 정보">
    <label>평가 대상<input id="m_target" type="text" placeholder="예: ㈜자비스"></label>
    <label>대상 품목<input id="m_item" type="text" placeholder="예: 삼차원 엑스선 단층촬영 자동검사 시스템"></label>
    <label>자료 기준일<input id="m_asof" type="date"></label>
    <label>목표 시점<input id="m_targetDate" type="text" placeholder="예: 2028년 말"></label>
    <label>평가자<input id="m_evaluator" type="text"></label>
  </section>

  <div class="main">
    <section class="inputs" id="inputs" aria-label="자료 입력"></section>
    <aside class="results" id="results" aria-label="평가 결과">
      <div>
        <div class="eyebrow">평가 결과</div>
        <h2 id="resTitle">축별 점수</h2>
      </div>
      <div class="summary" id="summary"></div>
      <div class="profile" id="profile"></div>
      <div class="legend">
        <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--accent)"></circle></svg>확정 점수</span>
        <span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="2 2"></circle></svg>목표 점수</span>
        <span><svg width="14" height="14"><rect x="2" y="5" width="10" height="4" fill="var(--na)"></rect></svg>확인 불가</span>
      </div>
      <div>
        <h3>과제 후보</h3>
        <p class="hint" style="margin:2px 0 8px">중요도 높음 · 확정 점수 2점 이하 · 회사가 통제 가능한 지표</p>
        <div class="tasks" id="tasks"></div>
      </div>
      <div>
        <h3>지표별 점수와 근거</h3>
        <p class="hint" style="margin:2px 0 8px">엔진 점수는 규칙으로 계산한 초안입니다. 평가자가 확정 점수를 바꾸면 사유를 적어 주세요.</p>
        <div class="tbl-wrap"><table id="scoreTable"></table></div>
      </div>
      <div class="ext" id="external"></div>
    </aside>
  </div>
</div>

<dialog id="dlgOpen">
  <h2>저장된 평가</h2>
  <div class="list" id="evalList"></div>
  <div style="display:flex;justify-content:flex-end"><button id="dlgClose" type="button">닫기</button></div>
</dialog>

<script type="application/json" id="defaultRubric">__RUBRIC__</script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const SVGNS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={},text)=>{const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e};

/* ---------- 상태 ---------- */
let rubric=JSON.parse($("#defaultRubric").textContent);
let state=blankState();
let db=null, downloads=null;

function blankState(){return{id:null,meta:{target:"",item:"",asof:"",targetDate:"",evaluator:""},values:{},overrides:{},targets:{}}}
function store(){try{localStorage.setItem("draft",JSON.stringify({rubric,state}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem("draft")||"null");if(d&&d.rubric&&d.state){rubric=d.rubric;state=Object.assign(blankState(),d.state)}}catch(e){}}

/* ---------- 채점 엔진 (순수 함수) ---------- */
const isNum=v=>typeof v==="number"&&isFinite(v);
function inputValue(id,values){const v=values[id];if(!v)return null;const x=v.value;if(x===""||x==null)return null;const n=Number(x);return isNum(n)?n:null}
function computeAll(rb,values){
  const vals={};
  for(const inp of rb.inputs)vals[inp.id]=inputValue(inp.id,values);
  for(const d of rb.derived||[]){const[a,b]=d.args.map(k=>vals[k]);let r=null;
    if(isNum(a)&&isNum(b)){if(d.op==="percent"&&b!==0)r=a/b*100;else if(d.op==="divide"&&b!==0)r=a/b;else if(d.op==="subtract")r=a-b}
    vals[d.id]=r}
  const out={};
  for(const ind of rb.indicators)out[ind.id]=scoreIndicator(ind,vals,rb);
  return{vals,out};
}
function fmt(n){if(!isNum(n))return"–";return Math.abs(n)>=100?n.toFixed(0):(Math.round(n*10)/10).toString()}
function cmp(a,op,b){switch(op){case">=":return a>=b;case">":return a>b;case"<=":return a<=b;case"<":return a<b;case"==":return a===b}return false}
function evalCond(c,vals){const v=vals[c.field];if(!isNum(v))return null;return cmp(v,c.op,c.value)}
function evalWhen(w,vals){
  if(w.all){let unknown=false;for(const c of w.all){const r=evalCond(c,vals);if(r===false)return false;if(r===null)unknown=true}return unknown?null:true}
  if(w.any){let unknown=false;for(const c of w.any){const r=evalCond(c,vals);if(r===true)return true;if(r===null)unknown=true}return unknown?null:false}
  return null}
function labelOf(rb,id){const i=rb.inputs.find(x=>x.id===id);if(i)return i.label;const d=(rb.derived||[]).find(x=>x.id===id);return d?d.label:id}
function unitOf(rb,id){const i=rb.inputs.find(x=>x.id===id)||(rb.derived||[]).find(x=>x.id===id);return i&&i.unit?i.unit:""}
function scoreIndicator(ind,vals,rb){
  const r=ind.rule;
  if(r.type==="range"){const v=vals[r.field];
    if(!isNum(v))return{score:null,explain:`${labelOf(rb,r.field)} 값이 없어 확인 불가`};
    for(const b of r.bands){const okMin=b.min==null||v>=b.min,okMax=b.max==null||v<b.max;
      if(okMin&&okMax){const rng=[b.min!=null?`${b.min} 이상`:"",b.max!=null?`${b.max} 미만`:""].filter(Boolean).join(" ");
        return{score:b.score,explain:`${labelOf(rb,r.field)} ${fmt(v)}${unitOf(rb,r.field)} → ${rng} 구간`}}}
    return{score:null,explain:"정의된 구간에 해당하지 않음"}}
  if(r.type==="ordinal"){const v=vals[r.field];const inp=rb.inputs.find(x=>x.id===r.field);
    if(!isNum(v))return{score:null,explain:`${labelOf(rb,r.field)} 미선택으로 확인 불가`};
    const opt=(inp.options||[]).find(o=>o.score===v);return{score:v,explain:`선택: ${opt?opt.label:v}`}}
  if(r.type==="conditions"){
    for(let i=0;i<r.cases.length;i++){const c=r.cases[i];const res=evalWhen(c.when,vals);
      if(res===null){const fs=(c.when.all||c.when.any).filter(x=>!isNum(vals[x.field])).map(x=>labelOf(rb,x.field));
        return{score:null,explain:`${[...new Set(fs)].join(", ")} 값이 없어 판정 불가`}}
      if(res===true){const parts=(c.when.all||c.when.any).map(x=>`${labelOf(rb,x.field)} ${fmt(vals[x.field])} ${x.op} ${x.value}`);
        return{score:c.score,explain:`조건 충족: ${parts.join(c.when.all?" 그리고 ":" 또는 ")}`}}}
    if(r.default!=null)return{score:r.default,explain:"앞의 조건에 해당하지 않아 기본 단계 적용"};
    return{score:null,explain:"조건에 해당하지 않음"}}
  return{score:null,explain:"알 수 없는 규칙"}}
function finalScore(id,auto){const o=state.overrides[id];return o&&o.score?Number(o.score):auto}

/* ---------- 입력 화면 ---------- */
function renderInputs(){
  const host=$("#inputs");host.replaceChildren();
  const shown=new Set();
  const derivedArgs=id=>{const d=(rubric.derived||[]).find(x=>x.id===id);return d?d.args.flatMap(derivedArgs):[id]};
  const fieldsOf=ind=>{const r=ind.rule;let f=r.type==="conditions"?r.cases.flatMap(c=>(c.when.all||c.when.any).map(x=>x.field)):[r.field];return[...new Set(f.flatMap(derivedArgs))]};
  for(const ax of rubric.axes){
    const block=el("div",{class:"axis-block"},el("div",{class:"axis-head"},el("span",{class:"axis-tag",text:ax.id}),el("h2",{text:ax.name}),el("span",{class:"hint",text:ax.description})));
    for(const ind of rubric.indicators.filter(i=>i.axis===ax.id)){
      const card=el("div",{class:"ind",id:"ind_"+ind.id},
        el("div",{class:"ind-head"},el("div",{},el("h3",{},el("span",{class:"mono muted",text:ind.id+" "}),ind.name),el("div",{class:"ind-q",text:ind.question})),el("span",{class:"chip cna",id:"chip_"+ind.id,text:"–"})));
      for(const fid of fieldsOf(ind)){
        if(shown.has(fid)){card.append(el("div",{class:"hint",text:`${labelOf(rubric,fid)}: 위에서 입력한 값을 사용합니다.`}));continue}
        shown.add(fid);const inp=rubric.inputs.find(x=>x.id===fid);if(!inp)continue;card.append(renderField(inp))}
      block.append(card)}
    host.append(block)}
  if(rubric.context&&rubric.context.length){
    const block=el("div",{class:"axis-block"},el("div",{class:"axis-head"},el("span",{class:"axis-tag",text:"C"}),el("h2",{text:"기업 여건"}),el("span",{class:"hint",text:"점수에 반영하지 않고, 방안의 실행 가능성을 판단하는 근거로 기록합니다."})));
    const card=el("div",{class:"ind"});
    for(const c of rubric.context)card.append(renderField(c));
    block.append(card);host.append(block)}
}
function renderField(inp){
  const cur=state.values[inp.id]||{};
  const set=(k,v)=>{state.values[inp.id]=Object.assign({},state.values[inp.id],{[k]:v});recompute();store()};
  let control;
  if(inp.type==="choice"){control=el("select",{id:"in_"+inp.id,onchange:e=>set("value",e.target.value)},el("option",{value:""},"선택 안 함 (확인 불가)"),...(inp.options||[]).map(o=>el("option",{value:o.score,selected:String(cur.value)===String(o.score)},`${o.score}. ${o.label}`)))}
  else if(inp.type==="text"){control=el("textarea",{id:"in_"+inp.id,rows:"2",placeholder:"내용 없음",oninput:e=>set("value",e.target.value)},cur.value||"")}
  else{control=el("input",{id:"in_"+inp.id,type:"number",step:inp.type==="integer"?"1":"any",inputmode:"decimal",value:cur.value??"",placeholder:"값 없음",oninput:e=>set("value",e.target.value)})}
  const ev=el("details",{class:"ev",open:(cur.source||cur.quote)?true:false},el("summary",{},"근거 기록"),
    el("div",{class:"ev-grid"},
      el("input",{id:"src_"+inp.id,type:"text",placeholder:"출처 (문서명, URL)",value:cur.source||"",oninput:e=>set("source",e.target.value)}),
      el("input",{id:"date_"+inp.id,type:"text",placeholder:"기준일",value:cur.date||"",oninput:e=>set("date",e.target.value)}),
      el("textarea",{id:"quote_"+inp.id,placeholder:"근거 문장 또는 산정 방법",oninput:e=>set("quote",e.target.value)},cur.quote||"")));
  return el("div",{class:"field"},el("label",{class:"field-label",for:"in_"+inp.id},el("span",{text:inp.label}),el("span",{class:"unit",text:inp.unit||""})),control,el("div",{class:"hint",text:"찾을 곳: "+inp.source_hint}),ev)
}

/* ---------- 결과 ---------- */
function recompute(){
  const{out}=computeAll(rubric,state.values);
  let scored=0,missing=0,over=0;
  for(const ind of rubric.indicators){const a=out[ind.id].score,f=finalScore(ind.id,a);
    const chip=$("#chip_"+ind.id);if(chip){chip.className="chip "+(f?"c"+f:"cna");chip.textContent=f?f+"점":"–"}
    if(f)scored++;else missing++;if(state.overrides[ind.id]&&state.overrides[ind.id].score)over++}
  $("#summary").replaceChildren(
    el("span",{},el("b",{text:scored}),` / ${rubric.indicators.length} 지표 채점`),
    el("span",{},el("b",{text:missing}),"  확인 불가"),
    el("span",{},el("b",{text:over}),"  평가자 수정"));
  $("#resTitle").textContent=state.meta.target?`${state.meta.target} 축별 점수`:"축별 점수";
  renderProfile(out);renderTable(out);renderTasks(out);
}
function renderProfile(out){
  const rowH=24,axGap=26,left=150,right=16,width=520,dotX=s=>left+(s-1)*((width-left-right-20)/4)+10;
  let y=22;const rows=[];
  for(const ax of rubric.axes){rows.push({ax,y});y+=axGap-6;for(const ind of rubric.indicators.filter(i=>i.axis===ax.id)){rows.push({ind,y});y+=rowH}y+=6}
  const h=y+6;const svg=sv("svg",{viewBox:`0 0 ${width} ${h}`,role:"img","aria-label":"지표별 확정 점수와 목표 점수"});
  for(let s=1;s<=5;s++){svg.append(sv("line",{x1:dotX(s),x2:dotX(s),y1:14,y2:h-4,stroke:"var(--line)","stroke-width":1}));svg.append(sv("text",{x:dotX(s),y:10,"text-anchor":"middle",class:"tick"},s))}
  for(const r of rows){
    if(r.ax){svg.append(sv("text",{x:0,y:r.y+10,class:"ax"},`${r.ax.id} · ${r.ax.name}`));continue}
    const ind=r.ind,cy=r.y+8,a=out[ind.id].score,f=finalScore(ind.id,a),t=state.targets[ind.id]?Number(state.targets[ind.id]):null;
    svg.append(sv("text",{x:0,y:cy+4,class:"lbl"},`${ind.id} ${ind.name}`));
    if(f&&t&&t>f)svg.append(sv("line",{x1:dotX(f),x2:dotX(t),y1:cy,y2:cy,stroke:"var(--accent)","stroke-width":2,"stroke-opacity":.45}));
    if(f)svg.append(sv("circle",{cx:dotX(f),cy,r:6,fill:`var(--s${f})`,stroke:"var(--surface)","stroke-width":1.5}));
    else svg.append(sv("rect",{x:dotX(1)-6,y:cy-2,width:dotX(5)-dotX(1)+12,height:4,fill:"var(--na)","fill-opacity":.45}));
    if(t)svg.append(sv("circle",{cx:dotX(t),cy,r:8,fill:"none",stroke:"var(--fg)","stroke-width":1.6,"stroke-dasharray":"2 2"}));
  }
  $("#profile").replaceChildren(svg);
}
function renderTable(out){
  const t=$("#scoreTable");t.replaceChildren();
  t.append(el("thead",{},el("tr",{},el("th",{text:"지표"}),el("th",{text:"엔진"}),el("th",{text:"확정"}),el("th",{text:"목표"}),el("th",{text:"적용 규칙과 수정 사유"}))));
  const tb=el("tbody");
  for(const ind of rubric.indicators){
    const a=out[ind.id].score,ov=state.overrides[ind.id]||{},f=finalScore(ind.id,a);
    const sel=el("select",{id:"ov_"+ind.id,"aria-label":ind.name+" 확정 점수",onchange:e=>{state.overrides[ind.id]=Object.assign({},ov,{score:e.target.value});recompute();store()}},
      el("option",{value:""},"엔진값"),...[1,2,3,4,5].map(s=>el("option",{value:s,selected:String(ov.score)===String(s)},s)));
    const tgt=el("select",{id:"tg_"+ind.id,"aria-label":ind.name+" 목표 점수",onchange:e=>{state.targets[ind.id]=e.target.value;recompute();store()}},
      el("option",{value:""},"–"),...[1,2,3,4,5].map(s=>el("option",{value:s,selected:String(state.targets[ind.id])===String(s)},s)));
    const reason=ov.score?el("input",{id:"rs_"+ind.id,type:"text",placeholder:"수정 사유",value:ov.reason||"",oninput:e=>{state.overrides[ind.id]=Object.assign({},state.overrides[ind.id],{reason:e.target.value});store()}}):null;
    const lv=f?ind.levels[String(f)]:null;
    tb.append(el("tr",{},
      el("td",{},el("div",{},el("span",{class:"mono muted",text:ind.id+" "}),ind.name),el("div",{class:"explain",text:`${ind.importance==="high"?"중요도 높음":ind.importance==="medium"?"중요도 중간":"중요도 낮음"} · ${ind.controllable==="yes"?"통제 가능":ind.controllable==="partial"?"부분 통제":"통제 불가"} · ${ind.anchor_type==="external"?"외부 기준":"사실 기준"}`})),
      el("td",{},el("span",{class:"chip "+(a?"c"+a:"cna"),text:a?a:"–"})),
      el("td",{},sel),el("td",{},tgt),
      el("td",{},el("div",{class:"explain",text:out[ind.id].explain}),lv?el("div",{class:"explain",text:"단계 의미: "+lv}):null,reason)));
  }
  t.append(tb);
  const ex=$("#external");ex.replaceChildren();
  if(rubric.context&&rubric.context.length){
    ex.append(el("h3",{text:"기업 여건 (점수 제외)"}));
    for(const c of rubric.context){const v=(state.values[c.id]||{}).value;
      ex.append(el("div",{class:"ctx"},el("b",{text:c.label}),el("div",{class:v?"":"muted",text:v||"기록 없음"})))}}
  ex.append(el("h3",{text:"외부 여건 (점수 제외)"}),...(rubric.external_factors||[]).map(x=>el("div",{},el("b",{text:x.name+" "}),el("span",{class:"muted",text:x.description}))));
}
function renderTasks(out){
  const host=$("#tasks");host.replaceChildren();
  const list=rubric.indicators.filter(ind=>{const f=finalScore(ind.id,out[ind.id].score);return ind.importance==="high"&&ind.controllable!=="no"&&f&&f<=2});
  if(!list.length){host.append(el("div",{class:"hint",text:"아직 해당 지표가 없습니다. 값을 입력하면 자동으로 표시됩니다."}));return}
  for(const ind of list){const f=finalScore(ind.id,out[ind.id].score);
    host.append(el("div",{class:"task"},el("span",{class:"chip c"+f,text:f+"점"}),el("div",{},el("b",{text:`${ind.id} ${ind.name}`}),el("div",{class:"explain",text:ind.question}))))}
}

/* ---------- 메타 ---------- */
function bindMeta(){
  const map={m_target:"target",m_item:"item",m_asof:"asof",m_targetDate:"targetDate",m_evaluator:"evaluator"};
  for(const[id,k]of Object.entries(map)){const n=$("#"+id);n.value=state.meta[k]||"";n.oninput=()=>{state.meta[k]=n.value;recompute();store()}}
}
function renderHeader(){$("#rubricName").textContent=rubric.meta.name;$("#rubricMeta").textContent=`평가 틀 v${rubric.meta.version} · ${rubric.meta.evaluation_mode==="absolute"?"절대평가":"평가"} · 지표 ${rubric.indicators.length}개`}
function renderAll(){renderHeader();bindMeta();renderInputs();recompute()}
function say(msg){$("#status").textContent=msg}

/* ---------- 저장·불러오기 ---------- */
function snapshot(){return{kind:"evaluation",rubric_id:rubric.meta.id,rubric_version:rubric.meta.version,rubric,meta:state.meta,values:state.values,overrides:state.overrides,targets:state.targets,scores:Object.fromEntries(Object.entries(computeAll(rubric,state.values).out).map(([k,v])=>[k,{engine:v.score,final:finalScore(k,v.score),explain:v.explain}])),updated_at:new Date().toISOString()}}
async function save(){
  if(!state.meta.target){say("평가 대상 이름을 먼저 입력해 주세요.");$("#m_target").focus();return}
  if(!db){store();say("이 화면에서는 서버 저장을 쓸 수 없어 이 브라우저에만 임시 저장했습니다.");return}
  try{const ref=state.id?db.collection("evaluations").doc(state.id):db.collection("evaluations").doc();
    await ref.set(snapshot());state.id=ref.id;store();say(`저장했습니다 (${new Date().toLocaleTimeString("ko-KR")}).`)}
  catch(e){say(e&&e.code==="invalid_argument"?"저장 권한이 없습니다. 이 페이지의 편집 권한이 있는 계정으로 열어 주세요.":"저장하지 못했습니다. 잠시 후 다시 시도해 주세요.")}
}
function loadSnapshot(d,id){
  if(d.rubric)rubric=d.rubric;
  state=Object.assign(blankState(),{id:id||null,meta:d.meta||{},values:d.values||{},overrides:d.overrides||{},targets:d.targets||{}});
  store();renderAll();
}
async function openList(){
  const list=$("#evalList");list.replaceChildren();
  if(!db){list.append(el("p",{class:"hint",text:"이 화면에서는 서버 저장소를 쓸 수 없습니다. JSON 파일 불러오기를 이용해 주세요."}))}
  else{try{const snap=await db.collection("evaluations").get();
      if(!snap.docs.length)list.append(el("p",{class:"hint",text:"저장된 평가가 없습니다. 평가 대상을 입력하고 '평가 저장'을 누르면 여기에 나타납니다."}));
      for(const doc of snap.docs){const d=doc.data()||{};const m=d.meta||{};
        list.append(el("button",{type:"button",onclick:()=>{loadSnapshot(d,doc.id);$("#dlgOpen").close();say(`'${m.target||"이름 없음"}' 평가를 열었습니다.`)}},
          el("span",{},el("b",{text:m.target||"이름 없음"}),el("span",{class:"hint",text:"  "+(m.item||"")})),
          el("span",{class:"hint mono",text:(d.updated_at||"").slice(0,10)})))}}
    catch(e){list.append(el("p",{class:"hint",text:"목록을 읽지 못했습니다. 잠시 후 다시 시도해 주세요."}))}}
  $("#dlgOpen").showModal();
}
async function exportJson(){
  const data=JSON.stringify(snapshot(),null,2);
  const name=`${(state.meta.target||"평가").replace(/[\\/:*?"<>|]/g,"")}_경쟁력진단_${new Date().toISOString().slice(0,10)}.json`;
  if(!downloads){try{const b=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say("JSON 파일을 저장했습니다.")}catch(e){say("파일을 저장하지 못했습니다.")}return}
  try{await downloads.save({filename:name,data});say("JSON 파일을 저장했습니다.")}
  catch(e){say(e&&e.code==="declined"?"저장을 취소했습니다.":"파일을 저장하지 못했습니다.")}
}
function importFile(file){
  const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);
      if(d.kind==="evaluation"){loadSnapshot(d,null);say("평가 파일을 불러왔습니다. 저장하면 새 평가로 기록됩니다.")}
      else if(d.meta&&d.indicators&&d.inputs){rubric=d;state=blankState();store();renderAll();say(`평가 틀 '${d.meta.name}'을 불러왔습니다.`)}
      else say("평가 틀이나 평가 파일 형식이 아닙니다.")}
    catch(e){say("JSON을 읽지 못했습니다. 파일 내용을 확인해 주세요.")}};
  fr.readAsText(file);
}

$("#btnSave").onclick=save;
$("#btnOpen").onclick=openList;
$("#dlgClose").onclick=()=>$("#dlgOpen").close();
$("#btnNew").onclick=()=>{state=blankState();store();renderAll();say("새 평가를 시작했습니다.")};
$("#btnExport").onclick=exportJson;
$("#btnImport").onclick=()=>$("#fileImport").click();
$("#fileImport").onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=""};

restore();renderAll();

if(window.claude&&window.claude.use){
  window.claude.use("db").then(async d=>{db=d;if(!db)return;
    try{const snap=await db.collection("evaluations").get();
      if(snap.docs.length){
        const docs=snap.docs.slice().sort((a,b)=>String((b.data()||{}).updated_at||"").localeCompare(String((a.data()||{}).updated_at||"")));
        const doc=docs[0],d=doc.data()||{};
        const stale=!state.meta.target||!state.id||(d.rubric&&d.rubric.meta&&rubric.meta&&(d.rubric.meta.id!==rubric.meta.id||d.rubric.meta.version!==rubric.meta.version));
        if(stale){loadSnapshot(d,doc.id);say(`최근 저장된 평가 '${(d.meta||{}).target||""}'를 불러왔습니다.`)}}}catch(e){}
  });
  window.claude.use("downloads").then(d=>{downloads=d;if(!d)$("#btnExport").hidden=true});
}
})();
</script>
